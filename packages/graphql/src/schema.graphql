"""Cursor-based pagination connection"""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

input PaginationInput {
  first: Int
  after: String
  last: Int
  before: String
}

input RepositoryFilters {
  search: String
  language: String
  health: RepoHealthFilter
  activity: RepoActivityFilter
  status: RepoStatusFilter
  sort: RepoSort
}

input CommitFilters {
  author: String
  classification: CommitClassification
  since: DateTime
  until: DateTime
}

input PullRequestFilters {
  state: PRStateFilter
  author: String
  risk: RiskFilter
  label: String
}

input IssueFilters {
  state: IssueStateFilter
  stale: Boolean
  critical: Boolean
  label: String
}

input DependencyFilters {
  update: DependencyFilter
  ecosystem: String
  search: String
}

input SecurityFilters {
  severity: SeverityFilter
  state: AlertStateFilter
  category: SecurityCategory
}

input WorkflowFilters {
  status: WorkflowStatusFilter
  branch: String
}

input UpdateProfileInput {
  name: String
  email: String
  avatarUrl: String
}

input WorkspaceSettingsInput {
  defaultBranch: String
  timezone: String
  syncIntervalMinutes: Int
  healthThreshold: Int
}

input UpdateWorkspaceInput {
  name: String
  slug: String
  settings: WorkspaceSettingsInput
}

input NotificationPreferenceInput {
  enabled: Boolean
  types: [NotificationType!]
}

input AddMemberInput {
  email: String!
  role: Role!
}

input UpdateMemberRoleInput {
  memberId: ID!
  role: Role!
}

input UpdateRoleInput {
  userId: ID!
  role: Role!
}

