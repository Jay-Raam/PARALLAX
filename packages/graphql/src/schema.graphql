"""
PARALLAX Engineering Intelligence Platform
GitHub records what happened. PARALLAX explains what it means.
"""

scalar DateTime
scalar JSON

enum RiskLevel {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

enum Priority {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

enum Severity {
  INFO
