"""Queries"""
type Query {
  me: User
  workspaces: [Workspace!]!
  workspace(id: ID!): Workspace!
  members: [WorkspaceMember!]!
  githubAccount: GitHubAccount

  repositories(filters: RepositoryFilters, pagination: PaginationInput): RepositoryConnection!
  repository(id: ID!): Repository!
  repositoryHealth(id: ID!, range: Range): RepositoryHealth
  branches(repositoryId: ID!): [Branch!]!
  commits(repositoryId: ID!, filters: CommitFilters, pagination: PaginationInput): CommitConnection!
  commit(id: ID!): Commit
  pullRequests(repositoryId: ID, filters: PullRequestFilters, pagination: PaginationInput): PullRequestConnection!
  pullRequest(id: ID!): PullRequest!
  issues(repositoryId: ID, filters: IssueFilters, pagination: PaginationInput): IssueConnection!
  issue(id: ID!): Issue
  dependencies(repositoryId: ID, filters: DependencyFilters, pagination: PaginationInput): DependencyConnection!
  securityAlerts(repositoryId: ID, filters: SecurityFilters, pagination: PaginationInput): SecurityAlertConnection!
  workflows(repositoryId: ID!): [Workflow!]!
  workflowRuns(repositoryId: ID, filters: WorkflowFilters, pagination: PaginationInput): WorkflowRunConnection!
  deployments(repositoryId: ID, pagination: PaginationInput): DeploymentConnection!
  releases(repositoryId: ID, pagination: PaginationInput): ReleaseConnection!
  contributors(repositoryId: ID, pagination: PaginationInput): ContributorConnection!
  recommendations(status: RecommendationStatus, pagination: PaginationInput): RecommendationConnection!
  notifications(pagination: PaginationInput): NotificationConnection!
  unreadNotificationCount: Int!
  notificationPreferences: NotificationPreferences!
  auditLogs(pagination: PaginationInput): AuditLogConnection!

  engineeringOverview: EngineeringOverview!
  engineeringActivity(filters: [ActivityFilter!], pagination: PaginationInput): ActivityConnection!
  commitAnalytics(repositoryId: ID, range: Range): CommitAnalytics!
  pullRequestAnalytics(repositoryId: ID, range: Range): PRAnalytics!
  issueAnalytics(repositoryId: ID, range: Range): IssueAnalytics!
  dependencyAnalytics(repositoryId: ID): DependencyAnalytics!
  securityAnalytics(repositoryId: ID): SecurityAnalytics!
  cicdAnalytics(repositoryId: ID, range: Range): CICDAnalytics!
  deploymentAnalytics(repositoryId: ID, range: Range): DeploymentAnalytics!
  releaseAnalytics(repositoryId: ID, range: Range): ReleaseAnalytics!
  contributorAnalytics(repositoryId: ID, range: Range): ContributorAnalytics!
  deliveryAnalytics(repositoryId: ID, range: Range): DeliveryFunnel!
  repositoryComparison(range: Range): [RepositoryComparisonItem!]!

  syncJob(repositoryId: ID!): SyncJob
  search(query: String!, limit: Int): SearchResults!
  availableRepositories: [AvailableRepository!]!
}

"""Mutations"""
type Mutation {
  login(email: String!): AuthPayload!
  logout: Boolean!

  createWorkspace(name: String!): Workspace!
  switchWorkspace(id: ID!): Workspace!
  updateWorkspace(id: ID!, input: UpdateWorkspaceInput!): Workspace!
  addMember(input: AddMemberInput!): WorkspaceMember!
  updateMemberRole(input: UpdateRoleInput!): WorkspaceMember!
  removeMember(userId: ID!): Boolean!

  connectGitHub(code: String!): ConnectGitHubPayload!
  disconnectGitHub: Boolean!

  connectRepository(githubId: Int!): Repository!
  disconnectRepository(repositoryId: ID!): Boolean!
  syncRepository(repositoryId: ID!, incremental: Boolean): SyncPayload!
  syncWorkspace: [SyncPayload!]!

  updateProfile(input: UpdateProfileInput!): User!
  updateNotificationPreferences(input: NotificationPreferenceInput!): NotificationPreferences!

  markRecommendationComplete(id: ID!): Recommendation!
  dismissRecommendation(id: ID!): Recommendation!
  markNotificationRead(id: ID!): Notification!
  markAllNotificationsRead: Boolean!
}

"""Subscriptions"""
type Subscription {
  syncProgressUpdated(repositoryId: ID!): SyncJob!
  notificationCreated: Notification!
  repositoryHealthUpdated(repositoryId: ID): RepositoryHealth!
  workflowRunUpdated(repositoryId: ID): WorkflowRun!
  deploymentUpdated(repositoryId: ID): Deployment!
}
