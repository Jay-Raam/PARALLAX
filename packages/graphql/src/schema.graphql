  ADMIN
  MEMBER
  VIEWER
}

enum SyncStatus {
  NOT_SYNCED
  SYNCING
  SYNCED
  ERROR
}

enum SyncJobStatus {
  QUEUED
  RUNNING
  COMPLETED
  FAILED
}

enum PRState {
  OPEN
  CLOSED
  MERGED
}

enum IssueState {
  OPEN
  CLOSED
}

enum WorkflowRunStatus {
  QUEUED
  IN_PROGRESS
  COMPLETED
  ACTION_REQUIRED
  CANCELLED
  FAILURE
  NEUTRAL
  SKIPPED
  STALE
