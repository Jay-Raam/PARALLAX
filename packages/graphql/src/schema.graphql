}

enum RecommendationStatus {
  ACTIVE
  COMPLETED
  DISMISSED
}

enum RecommendationType {
  DEPENDENCY_UPDATE
  SECURITY_VULNERABILITY
  STALE_ISSUES
  SLOW_REVIEWS
  CI_FAILURES
  DEPLOYMENT_FAILURES
  TESTING_GAPS
